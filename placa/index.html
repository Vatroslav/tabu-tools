<style>
  .title-block{display:flex;flex-direction:column;gap:20px}

  /* Calculation card */
  .card--calc{display:flex;flex-direction:column;gap:20px}
  .calc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px}
  .calc-grid label{display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:500}
  .num--big{width:100%;height:64px;padding:0 20px;border-radius:12px;background:var(--bg-elevated);border:2px solid var(--primary-strong);gap:10px}
  .num--big input{font-size:32px;letter-spacing:-.02em}
  .num--big .unit{font-size:18px}
  .sel--big select{width:100%;max-width:none;height:64px;border-radius:12px;font-size:18px;padding-left:20px}
  .sel--big::after{right:20px}
  .sel--big{width:100%}
  .calc-extra{padding-top:16px;border-top:1px solid var(--border-subtle)}
  .calc-extra .field{padding:0;border-top:0}
  .card--basic{padding-bottom:10px}
  .card--basic h2{margin-bottom:4px}
  .fields .field:first-child{border-top:0}

  /* Advanced accordion */
  .card--acc{padding:0;overflow:hidden}
  .card--acc .acc-head{padding:20px clamp(16px,2.4vw,28px)}
  .acc-title{display:flex;flex-direction:column;gap:4px}
  .acc-title span:first-child{font-size:18px;font-weight:600;letter-spacing:-.01em;color:var(--text)}
  .acc-title span:last-child{font-size:14px;color:var(--text-muted)}
  .acc-body{display:flex;flex-direction:column;gap:20px;padding:0 clamp(16px,2.4vw,28px) 20px}
  .acc-body[hidden]{display:none}
  .adv-group{display:flex;flex-direction:column}
  .adv-group .group-label{color:var(--primary-strong);padding:4px 0 8px}
  .adv-group .fields .field:first-child{border-top:1px solid var(--border-subtle)}

  /* Result card */
  .results-card{padding:24px;display:flex;flex-direction:column;gap:20px}
  .breakdown{display:flex;flex-direction:column}
  .breakdown .group-label{padding-bottom:6px}
  .breakdown .group-label + .group-label,.breakdown .row + .group-label,.breakdown .hint + .group-label{padding-top:18px}
  .sources{display:flex;flex-direction:column;border-top:1px solid var(--border-subtle)}
  .sources .acc-head{min-height:44px;font-size:14px;font-weight:500;color:var(--text)}
  .sources .acc-head:hover{background:transparent}
  .sources-body{display:flex;flex-direction:column;gap:6px;padding-bottom:4px;font-size:13px;line-height:1.45;color:var(--text-secondary)}
  .sources-body[hidden]{display:none}
  .sources-body .group-label{padding-top:8px}
  .sources-body .hint{font-size:12px;padding-top:4px}
  .actions{display:flex;flex-direction:column;gap:8px}

  @media (max-width:1030px){
    .page{padding-bottom:120px}
    .workbench__inputs,.workbench__aside{flex-basis:100%;max-width:none}
    .workbench__aside{position:static}
    .mobile-bar{display:flex}
    .seg--dir{width:100%;min-width:max-content}
    .seg--dir button{flex:1;min-width:0;padding:0 6px;font-size:13px}
    .num--big input{font-size:30px}
  }
</style>
