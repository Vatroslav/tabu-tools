<style>
  :root{
    /* Brand accents */
    --lavender:#BCB2F7;
    --lime:#E0FE90;
    --salmon:#FF9883;
    --ink:#15131F;
    /* Background - cool near-black ramp */
    --bg:#121216;
    --surface:#17171C;
    --surface-2:#26262E;
    /* Borders */
    --border:#2E2E38;
    --border-subtle:#1E1E25;
    /* Text */
    --text:#ECECF0;
    --muted:#8A8A96;
    --text-subtle:#6C6C78;
    /* Semantic (status) */
    --success:#54CE88;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Geist',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:0 0 36px;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}

  /* Header */
  header{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:26px 0 10px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:11px}
  .brand .logo{
    display:inline-flex;align-items:center;
    color:var(--text);text-decoration:none;transition:.15s;
  }
  .brand .logo:hover{color:var(--lavender)}
  .logo-svg{height:23px;width:auto;display:block}
  .lang-toggle{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px}
  .lang-toggle button{
    font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
    border:0;background:transparent;color:var(--muted);
    padding:6px 14px;border-radius:999px;transition:.15s;
  }
  .lang-toggle button.active{background:var(--lavender);color:var(--ink)}

  /* Hero */
  .hero{padding:12px 0 16px;border-bottom:1px solid var(--border);margin-bottom:18px}
  .hero h1{font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
  .hero p{color:var(--muted);margin-top:7px;font-size:14.5px;text-wrap:pretty}

  
  /* Layout */
  .grid{display:grid;grid-template-columns:1fr 360px;gap:22px;align-items:start}

  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:12px 14px 8px;margin-bottom:10px;
  }
  .card h2,.card h3{
    font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
    color:var(--lavender);margin:2px 0 6px;
  }
  .card h3{margin-top:14px}
  .seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
  .seg button{
    font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
    border:1px solid var(--border);background:var(--surface-2);color:var(--muted);
    padding:7px 12px;border-radius:999px;transition:.15s;
  }
  .seg button:hover{color:var(--text)}
  .seg button.active{background:var(--lavender);border-color:var(--lavender);color:var(--ink)}

  /* Country switch: top-level tabs above the calculator */
  .country-tabs{display:flex;justify-content:center;margin:0 0 18px}
  .country-tabs .seg{
    display:inline-flex;justify-content:center;gap:2px;margin:0;padding:4px;
    background:var(--surface);border:1px solid var(--border);border-radius:999px;
  }
  .country-tabs .seg button{border:0;background:transparent;padding:9px 18px;font-size:14px}
  .country-tabs .seg button.active{background:var(--lavender);color:var(--ink)}

  .fields{display:grid;grid-template-columns:1fr 1fr;column-gap:26px}
  .field{display:grid;grid-template-columns:1fr 128px;gap:12px;align-items:center;
    padding:6px 0;border-top:1px solid var(--border-subtle)}
  .field.wide{grid-template-columns:1fr;gap:6px}
  .field.check{grid-template-columns:1fr 22px}
  .field.span2{grid-row:span 2}
  .fields .field:nth-child(1),.fields .field:nth-child(2){border-top:0}
  .field label{font-size:13.5px;color:var(--text);line-height:1.3}
  .field .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}

  .input-shell{position:relative;display:flex;align-items:center}
  .input-shell .affix{
    position:absolute;right:12px;font-size:13px;color:var(--muted);
    font-family:'Geist Mono',monospace;pointer-events:none;
  }
  input[type=number],input[type=text],input[type=month],select{
    width:100%;font-family:'Geist Mono',monospace;font-size:14px;font-weight:500;
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:7px 11px;transition:.15s;color-scheme:dark;
  }
  input[type=number]{text-align:right;-moz-appearance:textfield}
  select{font-family:inherit;cursor:pointer}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input.affixed{padding-right:44px}
  input.big{font-size:20px;padding:10px 50px 10px 12px}
  input:focus,select:focus{outline:none;border-color:var(--lavender);box-shadow:0 0 0 3px rgba(188,178,247,0.22)}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--lavender);cursor:pointer}

  details.advanced summary{
    cursor:pointer;font-size:13.5px;font-weight:600;color:var(--text);padding:4px 0;
  }
  details.advanced[open] summary{margin-bottom:4px}
  ul.info{margin:12px 0 4px 18px;color:var(--muted);font-size:12.5px;line-height:1.45}

  /* Results */
  .results{position:sticky;top:16px}
  .results-card{
    background:linear-gradient(165deg,#1E1E25,#17171C);
    border:1px solid var(--border);border-radius:var(--radius);padding:18px;
  }
  .res-block{padding:6px 0}
  .res-block + .res-block{border-top:1px solid var(--border)}
  .res-label{font-size:12.5px;color:var(--muted);margin-bottom:2px}
  .res-value{font-family:'Geist Mono',monospace;font-weight:600;letter-spacing:-.01em}
  .res-primary .res-value{font-size:31px;color:var(--lavender)}
  .res-primary .res-label{font-size:13px;color:var(--text);font-weight:500}
  .res-secondary .res-value{font-size:17px;color:var(--text)}
  .res-section-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 4px}
  .row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:2px 0}
  .row .v{font-family:'Geist Mono',monospace;white-space:nowrap}
  .row.info{color:var(--muted);font-size:12.5px}
  .row.sub,.row.base{color:var(--text)}
  .row.total{font-weight:600;border-top:1px solid var(--border);margin-top:3px;padding-top:5px}
  .row.total .v{color:var(--lime)}
  .note{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
  ul.notes{margin:2px 0 0 16px;font-size:12.5px;color:var(--salmon);line-height:1.45}
  details.sources{margin-top:12px;font-size:12.5px;color:var(--muted)}
  details.sources summary{cursor:pointer;color:var(--text);font-weight:500}
  details.sources ul{margin:6px 0 0 16px;line-height:1.45}

  .actions{display:grid;gap:8px;margin-top:14px}
  .btn{
    display:block;width:100%;cursor:pointer;text-align:center;
    background:transparent;border:1px solid var(--border);color:var(--muted);
    font-family:inherit;font-size:13px;font-weight:500;padding:10px;border-radius:12px;transition:.15s;
  }
  .btn:hover{border-color:var(--muted);color:var(--text)}
  .btn.primary{background:var(--lavender);border-color:var(--lavender);color:var(--ink);font-weight:600}

  footer{
    margin-top:26px;padding-top:18px;border-top:1px solid var(--border);
    color:var(--muted);font-size:13px;line-height:1.7;
  }

  @media(max-width:980px){
    .fields{grid-template-columns:1fr}
    .field.span2{grid-row:auto}
    .fields .field:nth-child(2){border-top:1px solid var(--border-subtle)}
  }
  @media(max-width:860px){
    .country-tabs .seg{border-radius:16px}
    .country-tabs .seg button{padding:8px 12px;font-size:13px}
    .grid{grid-template-columns:1fr}
    .results{position:static}
    .hero h1{font-size:23px}
  }
</style>
</head>

      </a>
    </div>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button id="lang-hr" data-lang="hr" class="active">HR</button>
      <button id="lang-en" data-lang="en">EN</button>
    </div>
  </header>

  <div class="hero">
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
  </div>

  <div class="country-tabs" id="country-tabs"></div>

  <div class="grid">
    <div class="inputs" id="inputs"></div>
    <div class="results">
      <div class="results-card">
        <div id="results"></div>
        <div class="actions">
          <button class="btn primary" id="copy" type="button" data-i18n="copy_link"></button>

    </div>
  </div>

  <footer>
    <div data-i18n="footer_author"></div>
    <div data-i18n="footer_contact"></div>
  </footer>
</div>
