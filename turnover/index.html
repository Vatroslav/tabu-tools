let touched = new Set();   // linked-default fields the user has manually overridden

/* Build the input DOM: one card per group, fields as label + number input rows */
function buildInputs(){
  const root = document.getElementById('inputs');
  root.innerHTML = '';
  touched = new Set();
  let fieldsWrap = null;
  for(const f of FIELDS){
    if(f.group){
      const card = document.createElement('div');
      card.className = 'card card--group';
      const head = document.createElement('div'); head.className = 'group-head';
      const text = document.createElement('div'); text.className = 'group-head__text';
      const h2 = document.createElement('h2'); h2.dataset.i18n = 'g_'+f.group;
      const desc = document.createElement('p'); desc.dataset.i18n = 'g_'+f.group+'_h';
      text.appendChild(h2); text.appendChild(desc);
      const sum = document.createElement('span'); sum.className = 'group-sum'; sum.id = 'sum-'+f.group;
      head.appendChild(text); head.appendChild(sum);
      card.appendChild(head);
      fieldsWrap = document.createElement('div'); fieldsWrap.className = 'fields';
      card.appendChild(fieldsWrap);
      root.appendChild(card);
      continue;
    }
    const row = document.createElement('div'); row.className='field';
    const lab = document.createElement('label'); lab.setAttribute('for', f.id);
    const labText = document.createElement('span'); labText.dataset.i18n = f.id;
    lab.appendChild(labText);
    const shell = document.createElement('span'); shell.className='num';
    const inp = document.createElement('input');
    inp.type='number'; inp.id=f.id; inp.min='0'; inp.step='any'; inp.autocomplete='off';
    const unit = document.createElement('span'); unit.className='unit';
    if(f.affix==='eur') unit.textContent='€';
    else if(f.affix==='pct') unit.textContent='%';
    else if(f.affix==='h') unit.textContent='h';
    else if(f.affix==='mo') unit.dataset.i18n='unit_mo';
    else if(f.affix==='x') unit.textContent='×';
    shell.appendChild(inp); shell.appendChild(unit);
    row.appendChild(lab); row.appendChild(shell);
    fieldsWrap.appendChild(row);
    // Prefill with the Sheet's default values; optional additive fields stay blank (=0).
    // Linked fields (if0dyn) are filled live by compute() so they track their formula.
    if(f.kind!=='add' && f.kind!=='if0dyn'){
      inp.value = f.def;
    }
    inp.addEventListener('input', ()=>{ if(f.kind==='if0dyn') touched.add(f.id); compute(); });
  }
}

/* Read raw input value (NaN if empty) */
function raw(id){
  const el = document.getElementById(id);
  if(!el || el.value.trim()==='') return NaN;
  return parseFloat(el.value);
}

function compute(){
  const s = {};
  // base values (direct, default when empty)
  s.workingHours = (raw('workingHours')>0) ? raw('workingHours') : 160;
  const base = (id,d)=> isNaN(raw(id)) ? d : raw(id);
  const if0  = (id,d)=> (raw(id)>0) ? raw(id) : d;
  const add  = (id)=> isNaN(raw(id)) ? 0 : raw(id);
  // Linked default: shows & uses the computed value, auto-updating until the
  // user types into it (mirrors the Sheet's recomputing C-column formulas).
  // Clearing the field re-links it.
  const linked = (id,defVal)=>{
    const el = document.getElementById(id);
    const r = raw(id);
    if(!touched.has(id) || isNaN(r)){
      touched.delete(id);
      el.value = Math.round(defVal*100)/100;
      return defVal;
    }
    return (r>0) ? r : defVal;
  };

  s.salaryDeparting = base('salaryDeparting',2500);
  s.salaryRecruiter = base('salaryRecruiter',1500);
  s.salaryManager   = base('salaryManager',3000);
  s.salaryOthers    = base('salaryOthers',2000);
  s.salaryTrainer   = base('salaryTrainer',3000);

  const H = s.workingHours || 160;
  const hDep = s.salaryDeparting / H;
  const hRec = s.salaryRecruiter / H;
  const hMgr = s.salaryManager / H;
  const hOth = s.salaryOthers / H;
  const hTrn = s.salaryTrainer / H;

  s.onboardingCompleted = add('onboardingCompleted');
  s.monthsVacant        = if0('monthsVacant',3);
  s.coveringCost        = linked('coveringCost', s.salaryDeparting/2);
  s.opportunityCost     = add('opportunityCost');
  s.disgruntledCost     = add('disgruntledCost');
  s.onboardingMonths    = if0('onboardingMonths',3);
  s.relocationCost      = add('relocationCost');
  s.hoursReviewing      = if0('hoursReviewing',8);
  s.hoursInterviewing   = if0('hoursInterviewing',16);
  s.adminCost           = if0('adminCost',100);
  s.advertisingCost     = if0('advertisingCost',100);
  s.earlyDepartureChance= if0('earlyDepartureChance',5) / 100;
  s.managerHours        = if0('managerHours',8);
  s.numPeople           = if0('numPeople',2);
  s.hoursPerPerson      = if0('hoursPerPerson',5);
  s.trainingHours       = if0('trainingHours',60);
  s.referralBonus       = add('referralBonus');

  // Per-group parts of the hiring cost
  const recruitment = hRec*(s.hoursReviewing + s.hoursInterviewing) + s.adminCost + s.advertisingCost;
  const manager     = hMgr*s.managerHours;
  const others      = hOth*s.numPeople*s.hoursPerPerson;
  const training    = hTrn*s.trainingHours;

  // E6 — Cost of hiring a new employee
  const E6 = recruitment + manager + training + s.relocationCost + others + s.referralBonus;
  s.E6 = E6;

  // E7 — Salary during onboarding (new hire)
  const E7 = s.salaryDeparting * s.onboardingMonths;
  // E8 — Total cost of hiring
  const E8 = E6 + E7;

  // Already spent on departing — linked default = E6 + salary*onboardingCompleted
  const alreadySpent = linked('alreadySpent', E6 + s.salaryDeparting*s.onboardingCompleted);

  // Parts of the total: the vacancy, what was invested in the departing person, hiring a replacement
  const vacancy = s.monthsVacant*s.coveringCost + s.opportunityCost + s.disgruntledCost;
  const spent   = alreadySpent + s.salaryDeparting*s.onboardingCompleted;

  // E2 — Total cost of turnover
  const E2 = vacancy + spent + E6;

  const E3 = E2 * (1 + s.earlyDepartureChance);   // total + chance
  const E9 = E8 * (1 + s.earlyDepartureChance);   // hiring + chance

  setOut('out-total', E2);
  setOut('out-total-chance', E3);
  setOut('mb-total', E2);
  setOut('mb-total-chance', E3);
  setOut('out-hiring-new', E6);
  setOut('out-onboarding', E7);
  setOut('out-hiring-total', E8);
  setOut('out-hiring-chance', E9);

  document.getElementById('split-title').textContent = I18N[lang].split_title.replace('{total}', fmt(E2));
  setOut('out-vacancy', vacancy);
  setOut('out-spent', spent);
  setOut('out-hire', E6);
  setBar('bar-vacancy', vacancy);
  setBar('bar-spent', spent);
  setBar('bar-hire', E6);

  // Group subtotals shown in the card headers; relocation counts where its field is
  document.getElementById('sum-general').textContent = fmtNum(H) + ' h';
  setOut('sum-departing', vacancy + spent + s.relocationCost);
  setOut('sum-recruitment', recruitment);
  setOut('sum-manager', manager);
  setOut('sum-others', others);
  setOut('sum-training', training);
  setOut('sum-referral', s.referralBonus);
}

function fmtNum(n){
  return new Intl.NumberFormat(lang==='hr' ? 'hr-HR' : 'en-US',{maximumFractionDigits:0}).format(Math.round(n));
}
function fmt(n){
  if(!isFinite(n)) n = 0;
  return lang==='hr' ? fmtNum(n) + ' €' : '€' + fmtNum(n);
}
function setOut(id,val){ document.getElementById(id).textContent = fmt(val); }
function setBar(id,val){ document.getElementById(id).style.flex = String(Math.max(0, isFinite(val) ? val : 0)); }

function applyLang(){
  const t = I18N[lang];
  document.documentElement.lang = lang;
  document.title = t.doc_title;
  document.getElementById('cta').href = t.cta_url + '?' + CTA_UTM;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.dataset.i18n;
    if(t[key]!==undefined) el.textContent = t[key];
  });
  document.getElementById('lang-en').setAttribute('aria-pressed', String(lang==='en'));
  document.getElementById('lang-hr').setAttribute('aria-pressed', String(lang==='hr'));
  window.tabuTheme.apply();
  compute();
}

document.querySelectorAll('.lang-toggle button').forEach(b=>{
  b.addEventListener('click', ()=>{
    lang = b.dataset.lang;
    window.tabuLang.save(lang);
    // Keep the manual choice in the URL so a refresh (or a shared link) stays in this language
    const u = new URL(location.href); u.searchParams.set('lang', lang);
    history.replaceState(null, '', u);
    applyLang();
  });
});
document.getElementById('reset').addEventListener('click', ()=>{
  buildInputs();   // restores the Sheet default values
  applyLang();
});

buildInputs();
applyLang();
</script>
