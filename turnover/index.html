<style>
  :root{
    /* Brand accents */
    --lavender:#BCB2F7;
    --lime:#E0FE90;
    --salmon:#FF9883;
    --ink:#15131F;
    /* Background - cool near-black ramp */
    --bg:#121216;
    --surface:#17171C;
    --surface-2:#26262E;
    /* Borders */
    --border:#2E2E38;
    --border-subtle:#1E1E25;
    /* Text */
    --text:#ECECF0;
    --muted:#8A8A96;
    --text-subtle:#6C6C78;
    /* Semantic (status) */
    --success:#54CE88;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Geist',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:0 0 36px;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}

  /* Header */
  header{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:26px 0 10px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:11px}
  .brand .logo{
    display:inline-flex;align-items:center;
    color:var(--text);text-decoration:none;transition:.15s;
  }
  .brand .logo:hover{color:var(--lavender)}
  .logo-svg{height:23px;width:auto;display:block}
  .lang-toggle{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px}
  .lang-toggle button{
    font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
    border:0;background:transparent;color:var(--muted);
    padding:6px 14px;border-radius:999px;transition:.15s;
  }
  .lang-toggle button.active{background:var(--lavender);color:var(--ink)}

  /* Hero */
  .hero{padding:12px 0 16px;border-bottom:1px solid var(--border);margin-bottom:18px}
  .hero h1{font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
  .hero p{color:var(--muted);margin-top:7px;font-size:14.5px;text-wrap:pretty}

  /* Layout */
  .grid{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}

  /* Input cards */
  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:11px 14px 4px;margin-bottom:10px;
  }
  .card h2{
    font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
    color:var(--lavender);margin-bottom:2px;
  }
  .card .hint{font-size:12.5px;color:var(--muted);margin-bottom:5px;line-height:1.35}

  /* Two-column dense field grid (Sheet-like density) */
  .fields{display:grid;grid-template-columns:1fr 1fr;column-gap:26px}
  .field{display:grid;grid-template-columns:1fr 104px;gap:12px;align-items:center;
    padding:5px 0;border-top:1px solid var(--border-subtle)}
  /* hide the divider on the first row of each column */
  .fields .field:nth-child(1),.fields .field:nth-child(2){border-top:0}
  .field label{font-size:13.5px;color:var(--text);line-height:1.3}
  .field .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}

  .input-shell{position:relative;display:flex;align-items:center}
  .input-shell .affix{
    position:absolute;right:12px;font-size:13px;color:var(--muted);
    font-family:'Geist Mono',monospace;pointer-events:none;
  }
  .input-shell.left .affix{left:12px;right:auto}
  input[type=number]{
    width:100%;font-family:'Geist Mono',monospace;font-size:14px;font-weight:500;
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:7px 11px;text-align:right;transition:.15s;
    -moz-appearance:textfield;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=number].affixed{padding-right:30px}
  input[type=number].affixed-left{padding-left:26px;text-align:right}
  input[type=number]:focus{outline:none;border-color:var(--lavender);box-shadow:0 0 0 3px rgba(188,178,247,0.22)}
  input[type=number]::placeholder{color:var(--text-subtle)}

  /* Results */
  .results{position:sticky;top:16px}
  .results-card{
    background:linear-gradient(165deg,#1E1E25,#17171C);
    border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px;
  }
  .res-block{padding:7px 0}
  .res-block + .res-block{border-top:1px solid var(--border)}
  .res-label{font-size:12.5px;color:var(--muted);margin-bottom:3px}
  .res-value{font-family:'Geist Mono',monospace;font-weight:600;letter-spacing:-.01em}
  .res-primary .res-value{font-size:31px;color:var(--lavender)}
  .res-primary .res-label{font-size:13px;color:var(--text);font-weight:500}
  .res-secondary .res-value{font-size:18px;color:var(--text)}
  .res-sub .res-value{font-size:15px;color:var(--lavender)}
  .res-divider{height:1px;background:var(--border);margin:6px 0}
  .res-section-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 0 0}

  .cta{
    display:block;text-align:center;margin-top:14px;
    background:var(--lavender);color:var(--ink);font-weight:600;font-size:14.5px;
    text-decoration:none;padding:13px;border-radius:12px;transition:.15s;
  }
  .cta:hover{filter:brightness(1.06)}
  .reset{
    display:block;width:100%;margin-top:10px;cursor:pointer;
    background:transparent;border:1px solid var(--border);color:var(--muted);
    font-family:inherit;font-size:13px;font-weight:500;padding:10px;border-radius:12px;transition:.15s;
  }
  .reset:hover{border-color:var(--muted);color:var(--text)}

  footer{
    margin-top:26px;padding-top:18px;border-top:1px solid var(--border);
    color:var(--muted);font-size:13px;line-height:1.7;
  }
  footer a{color:var(--lavender);text-decoration:none}
  footer a:hover{text-decoration:underline}

  @media(max-width:980px){
    .fields{grid-template-columns:1fr}
    .fields .field:nth-child(2){border-top:1px solid var(--border-subtle)}
  }
  @media(max-width:860px){
    .grid{grid-template-columns:1fr}
    .results{position:static}
    .hero h1{font-size:23px}
    .field{grid-template-columns:1fr 116px}

    r_hiring_chance:'Trošak zapošljavanja uvećan za rani odlazak',
    cta:'Pogledaj kako Tabu pomaže tvojem poslovanju →',
    reset:'Vrati na zadane vrijednosti',
    footer_sheet:'Više voliš tablicu? Otvori Google Sheets verziju →',
    footer_author:'Izradio Vatroslav Mileusnić, suosnivač Tabua.',
    footer_contact:'Pitanja ili povratne informacije? Piši mi na vatroslav@tabu.hr',
  }
};

// Language: ?lang=hr|en, else browser language (Croatian, Serbian, Bosnian -> HR; Montenegro and anything else -> EN)
function initialLang(){
  const p = new URLSearchParams(location.search).get('lang');
  if(p==='hr' || p==='en') return p;
  const parts = (navigator.language||'').toLowerCase().split('-');
  return ['hr','sr','bs','sh'].includes(parts[0]) && !parts.includes('me') ? 'hr' : 'en';
}
const CTA_UTM = 'utm_source=kalkulator&utm_medium=cta&utm_campaign=turnover';

let lang = initialLang();
let touched = new Set();   // linked-default fields the user has manually overridden

/* Build the input DOM */
function buildInputs(){
  const root = document.getElementById('inputs');
  root.innerHTML = '';
  touched = new Set();
  let card = null, fieldsWrap = null;
  for(const f of FIELDS){
    if(f.group){
      card = document.createElement('div');
      card.className = 'card';
      const h2 = document.createElement('h2'); h2.dataset.i18n = 'g_'+f.group;
      const hint = document.createElement('div'); hint.className='hint'; hint.dataset.i18n = 'g_'+f.group+'_h';
      card.appendChild(h2); card.appendChild(hint);
      fieldsWrap = document.createElement('div'); fieldsWrap.className = 'fields';
      card.appendChild(fieldsWrap);
      root.appendChild(card);
      continue;
    }
    const row = document.createElement('div'); row.className='field';
    const lab = document.createElement('label'); lab.setAttribute('for', f.id); lab.dataset.i18n = f.id;
    const shell = document.createElement('div'); shell.className='input-shell';
    const inp = document.createElement('input');
    inp.type='number'; inp.id=f.id; inp.min='0'; inp.step='any'; inp.autocomplete='off';
    const affix = document.createElement('span'); affix.className='affix';
    if(f.affix==='eur'){ shell.classList.add('left'); affix.textContent='€'; inp.classList.add('affixed-left'); }
    else if(f.affix==='pct'){ affix.textContent='%'; inp.classList.add('affixed'); }
    else if(f.affix==='h'){ affix.textContent='h'; inp.classList.add('affixed'); }
    else if(f.affix==='mo'){ affix.dataset.i18n='unit_mo'; inp.classList.add('affixed'); }
    else if(f.affix==='x'){ affix.textContent='×'; inp.classList.add('affixed'); }
    shell.appendChild(inp); shell.appendChild(affix);
    row.appendChild(lab); row.appendChild(shell);
    fieldsWrap.appendChild(row);
    // Prefill with the Sheet's default values; optional additive fields stay blank (=0).
    // Linked fields (if0dyn) are filled live by compute() so they track their formula.
    if(f.kind!=='add' && f.kind!=='if0dyn'){
      inp.value = f.def;
    }
    inp.addEventListener('input', ()=>{ if(f.kind==='if0dyn') touched.add(f.id); compute(); });
  }
}

/* Read raw input value (NaN if empty) */
function raw(id){
  const el = document.getElementById(id);
  if(!el || el.value.trim()==='') return NaN;
  return parseFloat(el.value);
}

function compute(){
  const s = {};
  // base values (direct, default when empty)
  s.workingHours = (raw('workingHours')>0) ? raw('workingHours') : 160;
  const base = (id,d)=> isNaN(raw(id)) ? d : raw(id);
  const if0  = (id,d)=> (raw(id)>0) ? raw(id) : d;
  const add  = (id)=> isNaN(raw(id)) ? 0 : raw(id);
  // Linked default: shows & uses the computed value, auto-updating until the
  // user types into it (mirrors the Sheet's recomputing C-column formulas).
  // Clearing the field re-links it.
  const linked = (id,defVal)=>{
    const el = document.getElementById(id);
    const r = raw(id);
    if(!touched.has(id) || isNaN(r)){
      touched.delete(id);
      el.value = Math.round(defVal*100)/100;
      return defVal;
    }
    return (r>0) ? r : defVal;
  };

  s.salaryDeparting = base('salaryDeparting',2500);
  s.salaryRecruiter = base('salaryRecruiter',1500);
  s.salaryManager   = base('salaryManager',3000);
  s.salaryOthers    = base('salaryOthers',2000);
  s.salaryTrainer   = base('salaryTrainer',3000);

  const H = s.workingHours || 160;
  const hDep = s.salaryDeparting / H;
  const hRec = s.salaryRecruiter / H;
  const hMgr = s.salaryManager / H;
  const hOth = s.salaryOthers / H;
  const hTrn = s.salaryTrainer / H;

  s.onboardingCompleted = add('onboardingCompleted');
  s.monthsVacant        = if0('monthsVacant',3);
  s.coveringCost        = linked('coveringCost', s.salaryDeparting/2);
  s.opportunityCost     = add('opportunityCost');
  s.disgruntledCost     = add('disgruntledCost');
  s.onboardingMonths    = if0('onboardingMonths',3);
  s.relocationCost      = add('relocationCost');
  s.hoursReviewing      = if0('hoursReviewing',8);
  s.hoursInterviewing   = if0('hoursInterviewing',16);
  s.adminCost           = if0('adminCost',100);
  s.advertisingCost     = if0('advertisingCost',100);
  s.earlyDepartureChance= if0('earlyDepartureChance',5) / 100;
  s.managerHours        = if0('managerHours',8);
  s.numPeople           = if0('numPeople',2);
  s.hoursPerPerson      = if0('hoursPerPerson',5);
  s.trainingHours       = if0('trainingHours',60);
  s.referralBonus       = add('referralBonus');

  // E6 — Cost of hiring a new employee
  const E6 = hRec*(s.hoursReviewing + s.hoursInterviewing)
           + s.adminCost + s.advertisingCost
           + hMgr*s.managerHours
           + hTrn*s.trainingHours
           + s.relocationCost
           + hOth*s.numPeople*s.hoursPerPerson
           + s.referralBonus;
  s.E6 = E6;

  // E7 — Salary during onboarding (new hire)
  const E7 = s.salaryDeparting * s.onboardingMonths;
  // E8 — Total cost of hiring
  const E8 = E6 + E7;

  // Already spent on departing — linked default = E6 + salary*onboardingCompleted
  const alreadySpent = linked('alreadySpent', E6 + s.salaryDeparting*s.onboardingCompleted);

  // E2 — Total cost of turnover
  const E2 = s.monthsVacant*s.coveringCost
           + s.opportunityCost
           + s.disgruntledCost
           + alreadySpent
           + E6
           + s.salaryDeparting*s.onboardingCompleted;

  const E3 = E2 * (1 + s.earlyDepartureChance);   // total + chance
  const E9 = E8 * (1 + s.earlyDepartureChance);   // hiring + chance

  setOut('out-total', E2);
  setOut('out-total-chance', E3);
  setOut('out-hiring-new', E6);
  setOut('out-onboarding', E7);
  setOut('out-hiring-total', E8);
  setOut('out-hiring-chance', E9);
}

function fmt(n){
  if(!isFinite(n)) n = 0;
  const rounded = Math.round(n);
  if(lang==='hr'){
    return new Intl.NumberFormat('hr-HR',{maximumFractionDigits:0}).format(rounded) + ' €';
  }
  return '€' + new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(rounded);
}
function setOut(id,val){ document.getElementById(id).textContent = fmt(val); }

function applyLang(){
  const t = I18N[lang];
  document.documentElement.lang = lang;
  document.title = t.doc_title;
  document.getElementById('cta').href = t.cta_url + '?' + CTA_UTM;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.dataset.i18n;
    if(t[key]!==undefined){
      el.textContent = t[key];
      if(el.classList.contains('hint') && t[key]===''){ el.style.display='none'; }
      else if(el.classList.contains('hint')){ el.style.display=''; }
    }
  });
  document.getElementById('lang-en').classList.toggle('active', lang==='en');
  document.getElementById('lang-hr').classList.toggle('active', lang==='hr');
  compute();
}

document.querySelectorAll('.lang-toggle button').forEach(b=>{
  b.addEventListener('click', ()=>{
    lang = b.dataset.lang;
    // Keep the manual choice in the URL so a refresh (or a shared link) stays in this language
    const u = new URL(location.href); u.searchParams.set('lang', lang);
    history.replaceState(null, '', u);
    applyLang();
  });
});
document.getElementById('reset').addEventListener('click', ()=>{
  buildInputs();   // restores the Sheet default values
  applyLang();
});

buildInputs();
applyLang();
</script>
